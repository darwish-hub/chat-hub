apiVersion: apps/v1
kind: Deployment
metadata:
  name: chathub-api
  labels:
    app: chathub-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chathub-api
  template:
    metadata:
      labels:
        app: chathub-api
    spec:
      containers:
      - name: chathub-api
        image: chathub-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ChatHub__PodId
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: chathub-config
        - secretRef:
            name: chathub-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
