apiVersion: v1
kind: ConfigMap
metadata:
  name: chathub-config
  namespace: chathub
data:
  nats-url: "nats://nats:4222"
  s3-bucket-name: "chathub-files"
  s3-region: "us-east-1"
  log-level: "Information"
  rate-limit-text: "30"
  rate-limit-voice: "10"
  rate-limit-window-seconds: "60"
  websocket-keepalive-seconds: "30"
