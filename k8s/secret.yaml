apiVersion: v1
kind: Secret
metadata:
  name: chathub-secrets
type: Opaque
stringData:
  Jwt__SigningKey: "your-super-secret-jwt-signing-key-min-32-chars"
  Mongo__ConnectionString: "mongodb://username:password@mongo:27017/chathub?authSource=admin"
  Redis__ConnectionString: "redis:6379,password=your-redis-password"
  Storage__AccessKey: "your-minio-access-key"
  Storage__SecretKey: "your-minio-secret-key"
