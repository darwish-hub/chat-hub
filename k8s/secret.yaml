apiVersion: v1
kind: Secret
metadata:
  name: chathub-secrets
  namespace: chathub
type: Opaque
stringData:
  mongodb-connection-string: "mongodb://mongo:27017/chathub"
  jwt-secret: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  aws-access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY"
  aws-secret-access-key: "REPLACE_WITH_AWS_SECRET_KEY"
