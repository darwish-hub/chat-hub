apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chathub-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chathub-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: active_websocket_connections
      target:
        type: AverageValue
        averageValue: "8000"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
