apiVersion: v1
kind: Service
metadata:
  name: chathub-api
  namespace: chathub
  labels:
    app: chathub-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: ws
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: chathub-api
