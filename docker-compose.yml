version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: chathub-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: chathub
    volumes:
      - mongo-data:/data/db
    networks:
      - chathub-network

  nats:
    image: nats:latest
    container_name: chathub-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--http_port 8222 --cluster_name chathub"
    networks:
      - chathub-network

  minio:
    image: minio/minio:latest
    container_name: chathub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - chathub-network

volumes:
  mongo-data:
  minio-data:

networks:
  chathub-network:
    driver: bridge
